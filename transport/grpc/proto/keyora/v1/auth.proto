syntax = "proto3";

package keyora.v1;

import "keyora/v1/types.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/rabbicse/keyora/transport/grpc/keyorapb;keyorapb";

// AuthService registers users, signs them in and manages their tokens. It is
// the gRPC form of the REST routes under /api/v1/auth.
//
// The caller is an application, identified in one of two ways:
//
//   - the metadata entry "authorization: Basic base64(client_id:client_secret)";
//   - the client_id and client_secret fields of the request.
//
// When both are present the metadata entry is used. A confidential
// application must present its secret. A public application sends its
// client_id alone; if the call carries an "origin" metadata entry (a browser
// calling through a proxy), that origin must be one of the application's
// allowed_origins.
//
// Every RPC of this service counts against the per-address limit on
// credential requests; a caller over the limit gets RESOURCE_EXHAUSTED with
// the reason "rate_limited".
service AuthService {
  // Register creates a user in the application's tenant and sends the
  // verification email. It does not sign the user in.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Login checks an email and password and opens a session.
  //
  // A wrong email and a wrong password give the same answer
  // (UNAUTHENTICATED, reason "invalid_credentials"). Repeated failures lock
  // the account for a while (FAILED_PRECONDITION, reason "account_locked",
  // with "retry_after_seconds" in the error metadata).
  rpc Login(LoginRequest) returns (LoginResponse);

  // Refresh exchanges a refresh token for a new access token and a new
  // refresh token. Each refresh token works once: presenting one a second
  // time revokes the whole session (reason "refresh_token_reused").
  rpc Refresh(RefreshRequest) returns (RefreshResponse);

  // Logout revokes a session, in one of two ways:
  //
  //   - with refresh_token set, together with application credentials: the
  //     session the refresh token belongs to. This form always succeeds, so
  //     it cannot be used to find out which tokens exist.
  //   - with refresh_token empty and "authorization: Bearer <access token>":
  //     the session behind the access token.
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // Introspect reports the live state of an access token: whether its
  // session, user and tenant are still in good standing. Only a confidential
  // application may call it, and only for tokens of its own tenant. A token
  // that is invalid for any reason yields active = false, not an error.
  rpc Introspect(IntrospectRequest) returns (IntrospectResponse);

  // RequestEmailVerification sends the verification email again. It succeeds
  // whether or not the address belongs to an account.
  rpc RequestEmailVerification(RequestEmailVerificationRequest) returns (RequestEmailVerificationResponse);

  // ConfirmEmail marks an address as verified using the token from the
  // verification email. The token is single use. No application credentials
  // are needed: the token is the credential.
  rpc ConfirmEmail(ConfirmEmailRequest) returns (ConfirmEmailResponse);

  // ForgotPassword emails a password reset token. It succeeds whether or not
  // the address belongs to an account.
  rpc ForgotPassword(ForgotPasswordRequest) returns (ForgotPasswordResponse);

  // ResetPassword sets a new password using the token from the reset email
  // and revokes all of the user's sessions. The token is single use. No
  // application credentials are needed: the token is the credential.
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
}

message RegisterRequest {
  // Application credentials, unless sent as Basic authorization metadata.
  string client_id = 1;
  string client_secret = 2;
  string email = 3;
  string password = 4;
  // Display name; optional.
  string name = 5;
}

message RegisterResponse {
  User user = 1;
}

message LoginRequest {
  // Application credentials, unless sent as Basic authorization metadata.
  string client_id = 1;
  string client_secret = 2;
  string email = 3;
  string password = 4;
}

message LoginResponse {
  Tokens tokens = 1;
  User user = 2;
}

message RefreshRequest {
  // Application credentials, unless sent as Basic authorization metadata.
  // They must belong to the application the session was opened through.
  string client_id = 1;
  string client_secret = 2;
  string refresh_token = 3;
}

message RefreshResponse {
  Tokens tokens = 1;
}

message LogoutRequest {
  // Application credentials, unless sent as Basic authorization metadata.
  // Used only when refresh_token is set.
  string client_id = 1;
  string client_secret = 2;
  // The refresh token of the session to revoke. Leave empty to revoke the
  // session of the bearer access token instead.
  string refresh_token = 3;
}

message LogoutResponse {}

message IntrospectRequest {
  // Credentials of a confidential application, unless sent as Basic
  // authorization metadata.
  string client_id = 1;
  string client_secret = 2;
  // The access token to examine.
  string token = 3;
}

// IntrospectResponse describes a token. When active is false every other
// field is empty.
message IntrospectResponse {
  bool active = 1;
  // The user ID ("sub" claim), or the client ID for a client_credentials
  // token.
  string subject = 2;
  // The "tid" claim.
  string tenant_id = 3;
  // The application the token was issued to.
  string client_id = 4;
  // The "sid" claim. Empty for a client_credentials token.
  string session_id = 5;
  string email = 6;
  // The user's roles and permissions as they are now, which can differ from
  // the claims inside the token.
  repeated string roles = 7;
  repeated string permissions = 8;
  // The "iss" claim.
  string issuer = 9;
  // The "exp" claim.
  google.protobuf.Timestamp expires_at = 10;
  // The "iat" claim.
  google.protobuf.Timestamp issued_at = 11;
}

message RequestEmailVerificationRequest {
  // Application credentials, unless sent as Basic authorization metadata.
  string client_id = 1;
  string client_secret = 2;
  string email = 3;
}

message RequestEmailVerificationResponse {}

message ConfirmEmailRequest {
  // The token from the verification email.
  string token = 1;
}

message ConfirmEmailResponse {}

message ForgotPasswordRequest {
  // Application credentials, unless sent as Basic authorization metadata.
  string client_id = 1;
  string client_secret = 2;
  string email = 3;
}

message ForgotPasswordResponse {}

message ResetPasswordRequest {
  // The token from the reset email.
  string token = 1;
  string new_password = 2;
}

message ResetPasswordResponse {}
