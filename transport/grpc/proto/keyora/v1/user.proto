syntax = "proto3";

package keyora.v1;

import "keyora/v1/types.proto";

option go_package = "github.com/rabbicse/keyora/transport/grpc/keyorapb;keyorapb";

// UserService manages the users of a tenant and the roles assigned to them.
// It is the gRPC form of the REST routes under
// /api/v1/tenants/{tenant_id}/users.
//
// Every RPC needs "authorization: Bearer <credential>" metadata, where the
// credential is the root admin key or the access token of an administrator
// of the tenant named in the request. An administrator of another tenant
// gets PERMISSION_DENIED. A user ID that belongs to a different tenant than
// the one named is reported as NOT_FOUND.
service UserService {
  // CreateUser creates a user on behalf of an administrator. No verification
  // email is sent.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);

  // ListUsers lists the tenant's users, optionally filtered.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);

  // GetUser returns one user.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);

  // UpdateUser changes the fields that are set in the request. Disabling a
  // user revokes all of their sessions. A user's email and password cannot
  // be changed here.
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);

  // DeleteUser removes a user.
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);

  // UnlockUser clears the lock placed on an account after too many failed
  // sign-ins.
  rpc UnlockUser(UnlockUserRequest) returns (UnlockUserResponse);

  // ListUserRoles lists the roles assigned to a user.
  rpc ListUserRoles(ListUserRolesRequest) returns (ListUserRolesResponse);

  // AssignUserRole gives a user a role of the same tenant. Assigning a role
  // the user already has succeeds. It takes effect on the user's next call
  // to Keyora and in the next access token issued to them.
  rpc AssignUserRole(AssignUserRoleRequest) returns (AssignUserRoleResponse);

  // UnassignUserRole takes a role away from a user.
  rpc UnassignUserRole(UnassignUserRoleRequest) returns (UnassignUserRoleResponse);
}

message CreateUserRequest {
  string tenant_id = 1;
  string email = 2;
  string password = 3;
  // Display name; optional.
  string name = 4;
  // Marks the address as already verified.
  bool email_verified = 5;
}

message CreateUserResponse {
  User user = 1;
}

message ListUsersRequest {
  string tenant_id = 1;
  // Page size, 1 to 100. 0 means the default of 20.
  int32 limit = 2;
  // Number of users to skip.
  int32 offset = 3;
  // Filter: users whose email address contains this text, ignoring case.
  // Empty means no filter.
  string email = 4;
  // Filter: "active" or "disabled". Empty means no filter.
  string status = 5;
}

message ListUsersResponse {
  repeated User users = 1;
  // Number of matching users in total, across all pages.
  int64 total = 2;
}

message GetUserRequest {
  string tenant_id = 1;
  string id = 2;
}

message GetUserResponse {
  User user = 1;
}

// UpdateUserRequest changes only the fields that are set.
message UpdateUserRequest {
  string tenant_id = 1;
  string id = 2;
  optional string name = 3;
  // "active" or "disabled".
  optional string status = 4;
  optional bool email_verified = 5;
}

message UpdateUserResponse {
  User user = 1;
}

message DeleteUserRequest {
  string tenant_id = 1;
  string id = 2;
}

message DeleteUserResponse {}

message UnlockUserRequest {
  string tenant_id = 1;
  string id = 2;
}

message UnlockUserResponse {
  User user = 1;
}

message ListUserRolesRequest {
  string tenant_id = 1;
  string user_id = 2;
}

message ListUserRolesResponse {
  repeated Role roles = 1;
}

message AssignUserRoleRequest {
  string tenant_id = 1;
  string user_id = 2;
  string role_id = 3;
}

message AssignUserRoleResponse {}

message UnassignUserRoleRequest {
  string tenant_id = 1;
  string user_id = 2;
  string role_id = 3;
}

message UnassignUserRoleResponse {}
