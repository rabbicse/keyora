# Single-container deployment with the embedded SQLite database.
# Everything Keyora needs to keep lives in the keyora-data volume.
#
#   export KEYORA_ADMIN_KEY="$(openssl rand -hex 32)"
#   docker compose -f deploy/docker-compose.sqlite.yml up -d --build
services:
  keyora:
    build: ..
    image: keyora:dev
    ports:
      - "8080:8080"
    environment:
      KEYORA_ADMIN_KEY: ${KEYORA_ADMIN_KEY:?set KEYORA_ADMIN_KEY, for example with openssl rand -hex 32}
      KEYORA_ISSUER: ${KEYORA_ISSUER:-http://localhost:8080}
    volumes:
      - keyora-data:/data
    restart: unless-stopped

volumes:
  keyora-data:
