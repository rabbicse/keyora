# Reverse proxy for Keyora with TLS termination.
# Start Keyora with:
#   KEYORA_ISSUER=https://id.example.com
#   KEYORA_TRUST_PROXY_HEADERS=true      # use the client address nginx reports
#   KEYORA_HTTP_ADDR=127.0.0.1:8080      # not reachable except through nginx

upstream keyora {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name id.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name id.example.com;

    ssl_certificate     /etc/letsencrypt/live/id.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/id.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Keyora rejects bodies over 1 MiB itself; refuse them earlier here.
    client_max_body_size 1m;

    # Metrics are unauthenticated: keep them off the public internet.
    location = /metrics {
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://keyora;
    }

    location / {
        proxy_pass http://keyora;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite, do not append: Keyora trusts the right-most address, and
        # this makes that address the one nginx actually saw.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 35s;
    }
}
