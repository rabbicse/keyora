name: Feature request
description: Suggest something Keyora should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and what gets in your way today. This matters more than the proposed solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Keyora to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives you have considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This can be done without adding a third-party dependency to the core module
        - label: I am willing to work on this
