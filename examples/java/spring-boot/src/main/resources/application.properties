# Everything is configured through environment variables; see README.md.
server.port=${PORT:9006}

# Where this application reaches Keyora (REST API and JWKS).
keyora.url=${KEYORA_URL:http://localhost:8080}
# The "iss" value required in access tokens. Falls back to keyora.url when empty.
keyora.issuer=${KEYORA_ISSUER:}
# The application's credentials. The client ID is also the required "aud" value.
keyora.client-id=${KEYORA_CLIENT_ID:}
keyora.client-secret=${KEYORA_CLIENT_SECRET:}

# Timeouts for calls to Keyora.
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=10s

# Never include stack traces or exception messages in error responses.
server.error.include-message=never
server.error.include-stacktrace=never
